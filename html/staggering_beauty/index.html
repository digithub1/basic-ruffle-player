<head>

  <script type="text/javascript" src="lib/Tween.js"></script>

  <title>Staggering Beauty</title><meta name="robots" content="noindex">
  <meta name="title" content="Staggering Beauty" />

</head>
<body>

  <canvas id="canvas" resize></canvas>
 
  <div id="compat">
    <!-- It's way better on a desktop. -->
  </div>

  <div id="shake">
    Shake vigorously
  </div>

  <div id="warning">
    <span class="english">WARNING: CONTAINS FLASHING IMAGES</span>
  </div>

  <div id="enquiries" style="display:none">
    <a target="_top" href="#">Hey</a>
    <a id="embed-button" href="#">Ho</a>
  </div>

  <div id="embed">
    <textarea id="embed-text"></textarea>
  </div>
  
<script type="text/javascript">

var embedButton = document.getElementById('embed-button');
var embedShade = document.getElementById('embed');
var embedText = document.getElementById('embed-text');

embedButton.addEventListener('click', function(e) {
  e.preventDefault();
  embedShade.style.display = 'block';
  return false;
}, false);

embedShade.addEventListener('click', function() {
  embedShade.style.display = 'none';
}, false);

embedText.addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  this.select();
  return false;
})
</script>
</body>
</html>
